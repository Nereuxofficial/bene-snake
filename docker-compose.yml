version: "3.8"

services:
  bene-snake:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_REVISION: ${GIT_REVISION:-unknown}
    container_name: bene-snake
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - SENTRY_DSN=${SENTRY_DSN:-}
      - RUST_LOG=info
      - RUST_BACKTRACE=1
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - bene-snake-network

networks:
  bene-snake-network:
    driver: bridge
