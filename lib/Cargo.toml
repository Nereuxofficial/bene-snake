[package]
name = "lib"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
arrayvec = "0.7.8"
rayon = { workspace = true }
tracing = { workspace = true }
battlesnake-game-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true, features = ["simd_support"] }

tracy-client = { version = "=0.19.0", optional = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
alloc_tracker = "0.7.10"

[features]
bench = []
tracy = ["dep:tracy-client"]

[[bench]]
name = "mcts_rollout"
harness = false
required-features = ["bench"]

[[bench]]
name = "mcts_best_child"
harness = false
required-features = ["bench"]

[[bench]]
name = "mcts_expand"
harness = false
required-features = ["bench"]

[[bench]]
name = "mcts_allocations"
harness = false
required-features = ["bench"]

[[bench]]
name = "food_positions"
harness = false
required-features = ["bench"]

[[bench]]
name = "mcts_pruning"
harness = false

[[example]]
name = "tracy_hot_loop"
required-features = ["bench", "tracy"]

[[bench]]
name = "mcts_hotpaths"
harness = false
required-features = ["bench"]

[[example]]
name = "bench_fixture_actions"
required-features = ["bench"]
