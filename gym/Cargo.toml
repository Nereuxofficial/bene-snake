[package]
name = "gym"
version = "0.1.0"
edition = "2024"
description = "Certified paired production decision benchmark for Battlesnake"

[dependencies]
anyhow = "1.0.104"
sha2 = "0.10.9"
libc = "=0.2.189"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
clap = { workspace = true, features = ["derive"] }
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "process", "io-util", "fs"] }

[[bin]]
name = "snake-gym"
path = "src/main.rs"

[dev-dependencies]
battlesnake-game-types = { workspace = true }
