[package]
name = "gym"
version = "0.1.0"
edition = "2024"
description = "Benchmarking gym for pitting bene-snake against other snake implementations"

[dependencies]
lib = { workspace = true }
battlesnake-game-types = { workspace = true }
rand = { workspace = true, features = ["simd_support"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
clap = { workspace = true, features = ["derive"] }
rayon = { workspace = true }
indicatif = { workspace = true }
tabled = { workspace = true }
colored = { workspace = true }

[[bin]]
name = "snake-gym"
path = "src/main.rs"
