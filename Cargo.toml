[workspace]
members = ["lib", "gym"]
[workspace.dependencies]
battlesnake-game-types = { path = "./battlesnake-game-types" }
lib = { path = "lib" }
color-eyre = "0.6.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
dotenvy = "0.15.7"
tokio = "1.53.1"
axum = "0.8.9"
serde = "1.0.229"
simd-json = "0.18.1"
serde_json = "1.0.151"
sentry = { version = "0.49.3", default-features = false }
mimalloc = { version = "0.1.52", default-features = false }
tracing-tree = "0.4.1"
sentry-tracing = "0.49.3"
divan = "0.1.21"
once_cell = "1.21.4"
dashmap = "6.2.1"
ahash = "0.8.12"
minimax = "0.6.0"
rayon = "1.12.0"
rand = "0.10.3"
criterion = "0.8.2"
clap = "4.6.7"
indicatif = "0.18.6"
tabled = "0.22.0"
colored = "3.1.1"
itertools = "0.15.0"
fxhash = "0.2.1"
pprof = { version = "0.15.0", default-features = false }
tracing-flame = "0.2.0"

[package]
name = "bene-snake"
version = "0.1.1"
authors = ["Nereuxofficial <37740907+Nereuxofficial@users.noreply.github.com>"]
license = "GPLv3"
readme = "README.md"
edition = "2021"

[dependencies]
lib = { workspace = true }
color-eyre = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
dotenvy = { workspace = true }
tokio = { workspace = true, features = ["full"] }
axum = { workspace = true, features = ["macros"] }
battlesnake-game-types = { workspace = true }
serde = { workspace = true }
simd-json = { workspace = true }
serde_json = { workspace = true }
sentry = { workspace = true, features = ["backtrace", "contexts", "panic", "anyhow", "reqwest", "rustls", "debug-images"] }
# Faster allocator
mimalloc = { workspace = true }
tracing-tree = { workspace = true }
sentry-tracing = { workspace = true }

[features]
default = []
bench = ["lib/bench"]

[profile.release]
lto = true
debug = "limited"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
opt-level = 3
